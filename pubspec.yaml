name: taxicom_user_app
description: "تطبيق تاكسي كوم - جهة الراكب"
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_app_check: ^0.3.2+2
  firebase_storage: ^12.4.2
  firebase_database: ^11.3.2
  cloud_functions: ^5.1.0
  firebase_messaging: ^15.1.0
  firebase_remote_config: ^5.3.0
  flutter_local_notifications: ^18.0.0

  # Image Picker
  image_picker: ^1.0.7

  # Google Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geolocator_android: ^4.6.1
  geolocator_apple: ^2.3.8
  geocoding: ^3.0.0
  
  # Geohashing for efficient location queries
  geoflutterfire_plus: ^0.0.4

  # UI Components
  pin_code_fields: ^8.0.1
  intl: ^0.20.2
  
  # HTTP Client
  http: ^1.2.0
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # URL Launcher (for phone calls)
  url_launcher: ^6.2.0
  
  # Cached Network Image
  cached_network_image: ^3.3.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Ringtone Player (for notification sounds)
  flutter_ringtone_player: ^4.0.0+3
  
  # Package Info (for app version)
  package_info_plus: ^8.0.0
  
  # Device Info (for session management - unique device ID)
  device_info_plus: ^10.1.0
  
  # Share (for sharing trip details)
  share_plus: ^10.1.4
  
  # NTP (for accurate time synchronization)
  ntp: ^2.0.0
  record: ^6.2.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  flutter_stripe: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
